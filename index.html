<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סוכות בצפון</title>
<meta name="description" content="רשימה חיה משותפת לחמש משפחות — ארוחות, קניות וציוד לסופ״ש סוכות בצפון.">
<meta name="theme-color" content="#5F7A16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="סוכות בצפון">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#F1F3EA; --surface:#FFFFFF; --surface-2:#F8FAF2; --surface-3:#EBEEE1;
  --ink:#1B2017; --ink-2:#5A6353; --ink-3:#8B937E;
  --line:#DFE3D5; --line-2:#C9CFB9;
  --accent:#5F7A16; --accent-ink:#42540D; --accent-soft:#E9EFD5;
  --good:#2F7355; --good-soft:#E0EFE7;
  --warn:#A2521E;
  --chag:#8A2F3F; --chag-soft:#F8E9EB;
  --shadow:0 1px 1px rgba(27,32,23,.04), 0 10px 26px -16px rgba(27,32,23,.30);
  --radius:10px; --on-accent:#FFFFFF;
  color-scheme:light;
  --f-yavne:#B6702F; --f-rehovot:#2F7A99; --f-rg:#75589C; --f-oryam:#237F62; --f-moscow:#A63E52;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Assistant",-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:15px; line-height:1.5; margin:0;
  -webkit-font-smoothing:antialiased;
}
#app{direction:rtl; text-align:right}
.wrap{max-width:1060px; margin:0 auto; padding:0 18px}
h1,h2,h3{font-family:"Frank Ruhl Libre",Georgia,serif; margin:0; text-wrap:balance; font-weight:700}
button{font:inherit; color:inherit; cursor:pointer}
select,input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header.top{
  position:sticky; top:0; z-index:30;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.top-in{display:flex; flex-wrap:wrap; align-items:flex-end; gap:14px 22px; padding:14px 0 12px}
.brand h1{font-size:26px; font-weight:900; letter-spacing:-.01em; line-height:1.1}
.brand .kicker{
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); font-weight:700; margin-bottom:3px;
}
.brand .dates{color:var(--ink-2); font-size:13.5px; margin-top:2px}
.brand .dates b{color:var(--ink); font-weight:600}
.top-right{margin-inline-start:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap}

.gauge{display:flex; align-items:center; gap:10px}
.gauge .ring{position:relative; width:44px; height:44px; flex:none}
.gauge .ring svg{display:block; transform:rotate(-90deg)}
.gauge .ring span{
  position:absolute; inset:0; display:grid; place-items:center;
  font-size:11.5px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--accent-ink);
}
.gauge .g-txt{font-size:12.5px; color:var(--ink-2); line-height:1.35}
.gauge .g-txt b{display:block; color:var(--ink); font-size:13.5px; font-weight:600}

.whoami{display:flex; align-items:center; gap:7px}
.whoami label{font-size:12px; color:var(--ink-3); font-weight:600}
select.fampick{
  background:var(--surface); border:1px solid var(--line-2); border-radius:999px;
  padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer;
}
.live{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-3)}
.live .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-3); flex:none}
.live.on .dot{background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
.live .stack{display:flex}
.live .stack i{
  width:19px; height:19px; border-radius:50%; display:grid; place-items:center;
  font-style:normal; font-size:9.5px; font-weight:700; color:#fff;
  border:1.5px solid var(--bg); margin-inline-start:-6px;
}

/* ---------- tabs ---------- */
nav.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; padding-top:2px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  background:none; border:0; border-bottom:2px solid transparent;
  padding:9px 13px 10px; font-size:14px; font-weight:600; color:var(--ink-3);
  white-space:nowrap; display:flex; align-items:center; gap:7px;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
nav.tabs .cnt{
  font-size:11px; font-weight:700; background:var(--surface-3); color:var(--ink-2);
  border-radius:999px; padding:1px 6px; font-variant-numeric:tabular-nums;
}
nav.tabs button[aria-selected="true"] .cnt{background:var(--accent-soft); color:var(--accent-ink)}

main{padding:22px 0 90px}
.hint{color:var(--ink-3); font-size:12.5px}

/* ---------- toolbar ---------- */
.toolbar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:16px}
.chip{
  background:var(--surface); border:1px solid var(--line-2); color:var(--ink-2);
  border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:600;
}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.spacer{margin-inline-start:auto}

/* ---------- section / card ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  margin-bottom:12px; overflow:hidden;
}
.card.chag{border-color:color-mix(in srgb,var(--chag) 40%,var(--line))}
.card.chag .c-head{background:var(--chag-soft)}
.c-head{
  display:flex; align-items:center; gap:12px; padding:12px 15px;
  border-bottom:1px solid var(--line); background:var(--surface-2);
  width:100%; text-align:right; border-radius:0;
}
button.c-head{border:0; border-bottom:1px solid var(--line)}
.c-head .eyebrow{
  font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
  font-weight:700; color:var(--ink-3); display:block; margin-bottom:1px;
}
.card.chag .c-head .eyebrow{color:var(--chag)}
.c-head h3{font-size:18px; line-height:1.2}
.c-head .sub{font-size:12.5px; color:var(--ink-3); margin-top:2px}
.c-head .meta{margin-inline-start:auto; display:flex; align-items:center; gap:10px; flex:none}
.mini{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.bar{width:56px; height:5px; border-radius:99px; background:var(--surface-3); overflow:hidden; flex:none}
.bar i{display:block; height:100%; background:var(--accent); border-radius:99px}
.bar.full i{background:var(--good)}
.caret{color:var(--ink-3); font-size:11px; transition:transform .18s}
.card[data-open="0"] .caret{transform:rotate(-90deg)}
.card[data-open="0"] .c-body{display:none}

/* ---------- rows ---------- */
ul.rows{list-style:none; margin:0; padding:0}
.row{
  display:flex; align-items:center; gap:11px;
  padding:8px 15px 8px 12px; border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.tick{
  width:21px; height:21px; flex:none; border-radius:6px;
  border:1.5px solid var(--line-2); background:transparent;
  display:grid; place-items:center; padding:0; color:transparent; font-size:12px;
}
.tick:hover{border-color:var(--accent)}
.row.done .tick{background:var(--good); border-color:var(--good); color:#fff}
.qty{
  flex:none; min-width:66px; font-size:12.5px; font-weight:700; color:var(--accent-ink);
  font-variant-numeric:tabular-nums; letter-spacing:-.01em;
}
.row.done .qty{color:var(--ink-3)}
.name{flex:1 1 auto; min-width:0; font-size:14.5px}
.name .sub{display:block; font-size:11.5px; color:var(--ink-3)}
.row.done .name{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--line-2)}
.tags{display:flex; align-items:center; gap:6px; flex:none; flex-wrap:wrap; justify-content:flex-end}
.tag{
  font-size:11px; font-weight:600; border-radius:5px; padding:2px 7px;
  background:var(--surface-3); color:var(--ink-2); white-space:nowrap;
}
.tag.home{background:var(--accent-soft); color:var(--accent-ink)}
.fam-tag{
  font-size:11px; font-weight:700; border-radius:999px; padding:2px 9px; white-space:nowrap;
  border:1px solid; background:transparent;
}
select.buyer{
  border:1px dashed var(--line-2); background:transparent; color:var(--ink-3);
  border-radius:999px; padding:2px 8px; font-size:11.5px; font-weight:600; max-width:132px;
}
select.buyer.set{border-style:solid}
.kill{
  border:0; background:none; color:var(--ink-3); font-size:15px; line-height:1;
  padding:3px 5px; border-radius:5px; opacity:.4; flex:none;
}
.row:hover .kill, .kill:focus-visible{opacity:1}
.kill:hover{color:var(--warn); background:var(--surface-3)}

/* ---------- who are you ---------- */
#gate{
  position:fixed; inset:0; z-index:80; display:grid; place-items:center;
  padding:20px; background:color-mix(in srgb, var(--ink) 42%, transparent);
  backdrop-filter:blur(3px);
}
#gate .box{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  box-shadow:0 24px 60px -24px rgba(27,32,23,.45);
  padding:26px 24px; width:min(440px,100%); text-align:center;
}
#gate .kicker{
  display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); font-weight:700; margin-bottom:6px;
}
#gate h2{font-family:"Frank Ruhl Libre",Georgia,serif; font-size:24px; font-weight:900}
#gate p{color:var(--ink-2); font-size:13.5px; margin:8px 0 18px}
#gate .opts{display:flex; flex-direction:column; gap:8px}
#gate .opts button{
  display:flex; align-items:center; gap:11px; width:100%; text-align:right;
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:10px;
  padding:12px 14px; font-size:15px; font-weight:600;
}
#gate .opts button:hover{border-color:var(--accent); background:var(--accent-soft)}
#gate .opts button i{width:12px; height:12px; border-radius:50%; flex:none}

/* ---------- inline edit ---------- */
.name[data-act="edit"], .qty[data-act="edit"]{cursor:text; border-radius:4px}
.name[data-act="edit"]:hover, .qty[data-act="edit"]:hover{
  background:var(--surface-3); box-shadow:0 0 0 3px var(--surface-3);
}
.row.editing{display:flex; align-items:center; background:var(--accent-soft); padding:9px 15px}
form.editform{display:flex; align-items:center; gap:8px; width:100%; flex-wrap:wrap}
form.editform input{
  border:1px solid var(--line-2); background:var(--surface); border-radius:7px;
  padding:6px 9px; font-size:13.5px; min-width:0;
}
form.editform input.q{width:88px; flex:none; font-variant-numeric:tabular-nums}
form.editform input.t{flex:1 1 150px}
form.editform button{
  border:1px solid var(--accent); background:var(--accent); color:var(--on-accent);
  border-radius:7px; padding:6px 14px; font-size:13px; font-weight:700; flex:none;
}
form.editform button.ghost{background:transparent; color:var(--ink-2); border-color:var(--line-2)}

#toast{
  position:fixed; left:50%; bottom:20px; z-index:60;
  transform:translateX(-50%) translateY(160%); transition:transform .22s ease;
  display:flex; align-items:center; gap:14px; max-width:min(92vw,460px);
  background:#23291D; color:#F1F3EA; padding:10px 18px; border-radius:999px;
  font-size:13.5px; font-weight:600; box-shadow:0 12px 30px -12px rgba(0,0,0,.55);
  pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0); pointer-events:auto}
#toast button{background:none; border:0; color:#B6D14A; font-weight:800; font-size:13.5px; padding:2px 4px; text-decoration:underline; flex:none}

/* ---------- add row ---------- */
form.add{display:flex; align-items:center; gap:8px; padding:9px 15px; background:var(--surface-2); border-top:1px solid var(--line)}
form.add input{
  border:1px solid var(--line-2); background:var(--surface); border-radius:7px;
  padding:6px 9px; font-size:13.5px; min-width:0;
}
form.add input.q{width:82px; flex:none; font-variant-numeric:tabular-nums}
form.add input.t{flex:1 1 auto}
form.add button{
  border:1px solid var(--accent); background:var(--accent); color:var(--on-accent);
  border-radius:7px; padding:6px 14px; font-size:13px; font-weight:700; flex:none;
}

/* ---------- meal head extras ---------- */
.daybar{
  display:flex; align-items:center; gap:9px; margin:26px 0 10px;
}
.daybar:first-child{margin-top:0}
.daybar h2{font-size:15px; font-weight:700; color:var(--ink-2); letter-spacing:.01em}
.daybar .rule{flex:1 1 auto; height:1px; background:var(--line)}
.daybar .stamp{
  font-size:11px; font-weight:700; color:var(--ink-3); font-variant-numeric:tabular-nums;
  letter-spacing:.06em;
}
.chefline{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:10px 15px; border-bottom:1px solid var(--line); background:var(--surface);
  font-size:12.5px; color:var(--ink-3);
}
.chefline.mealedit{gap:6px 16px; background:var(--surface-2)}
.chefline.mealedit label{
  font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  font-weight:700; color:var(--ink-3);
}
.chefline.mealedit input{
  border:0; border-bottom:1px dashed var(--line-2); background:transparent;
  padding:3px 2px; font-size:13.5px; font-weight:600; min-width:110px; flex:1 1 160px;
}
.chefline.mealedit input:hover{border-bottom-color:var(--accent)}
.chefline select{
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:999px;
  padding:4px 11px; font-size:12.5px; font-weight:600;
}

/* ---------- families ---------- */
.famgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px}
.fam-card .c-head{border-inline-start:3px solid var(--fc)}
.fam-card.mine{box-shadow:var(--shadow)}
.you{font-size:10px; font-weight:800; letter-spacing:.1em; color:var(--accent-ink); background:var(--accent-soft); border-radius:4px; padding:1px 6px}
.assigned{padding:11px 15px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--ink-2); display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
.assigned b{font-size:19px; font-family:"Frank Ruhl Libre",serif; color:var(--ink); font-variant-numeric:tabular-nums}
.empty{padding:14px 15px; color:var(--ink-3); font-size:13px}

/* ---------- notice / skeleton ---------- */
.notice{
  border:1px solid var(--line-2); background:var(--surface-2); border-radius:var(--radius);
  padding:13px 15px; font-size:13.5px; color:var(--ink-2); margin-bottom:14px;
}
.notice b{color:var(--ink)}
.skel{height:44px; border-bottom:1px solid var(--line); background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2)); background-size:200% 100%; animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none} *{transition:none!important}}

.tripnote{
  display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center;
  padding:11px 15px; border:1px solid var(--line); border-radius:var(--radius);
  background:var(--surface); margin-bottom:16px;
}
.tripnote label{font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--ink-3)}
.tripnote input{
  border:0; border-bottom:1px dashed var(--line-2); background:transparent;
  padding:3px 2px; font-size:13.5px; font-weight:600; min-width:120px; flex:1 1 200px;
}
.tripnote input:hover{border-bottom-color:var(--accent)}

@media (max-width:640px){
  .brand h1{font-size:22px}
  .top-right{width:100%; margin-inline-start:0; justify-content:space-between}
  .row{
    display:grid; align-items:center; gap:5px 10px;
    grid-template-columns:auto 1fr auto;
    grid-template-areas:"tick name kill" "qty tags tags";
    padding:10px 14px;
  }
  .tick{grid-area:tick}
  .name{grid-area:name; min-width:0}
  .kill{grid-area:kill; opacity:1}
  .qty{grid-area:qty; min-width:0; text-align:center}
  .tags{grid-area:tags; justify-content:flex-start; flex-wrap:wrap}
  form.add{flex-wrap:wrap}
  form.add input.t{flex:1 1 100%; order:-1}
  .toolbar .chip[data-act="allshop"]{margin-inline-start:0 !important}
}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="he">
  <header class="top">
    <div class="wrap">
      <div class="top-in">
        <div class="brand">
          <span class="kicker">סופ״ש סוכות · וילה בצפון</span>
          <h1>סוכות בצפון</h1>
          <div class="dates"><b id="hdrDates">חמישי 24.9 — שבת 26.9</b> · 5 משפחות · 18 איש (9 ילדים)</div>
        </div>
        <div class="top-right">
          <div class="gauge">
            <div class="ring">
              <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
                <circle cx="22" cy="22" r="18" fill="none" stroke="var(--surface-3)" stroke-width="5"></circle>
                <circle id="ringArc" cx="22" cy="22" r="18" fill="none" stroke="var(--accent)" stroke-width="5"
                        stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="113.1"></circle>
              </svg>
              <span id="ringPct">0%</span>
            </div>
            <div class="g-txt"><b id="gaugeMain">— / —</b>פריטים נקנו</div>
          </div>
          <div class="whoami">
            <label for="fampick">אני</label>
            <select id="fampick" class="fampick" aria-label="בחירת המשפחה שלי">
              <option value="">בחרו משפחה…</option>
            </select>
          </div>
          <div class="live" id="live"><span class="dot"></span><span id="liveTxt">מתחבר…</span><span class="stack" id="liveStack"></span></div>
        </div>
      </div>
      <nav class="tabs" id="tabs" role="tablist">
        <button role="tab" data-tab="meals" aria-selected="true">ארוחות</button>
        <button role="tab" data-tab="shop" aria-selected="false">רשימת קניות <span class="cnt" id="cShop">–</span></button>
        <button role="tab" data-tab="gear" aria-selected="false">ציוד ולוגיסטיקה <span class="cnt" id="cGear">–</span></button>
        <button role="tab" data-tab="fams" aria-selected="false">רשימות המשפחות</button>
      </nav>
    </div>
  </header>
  <div id="gate" hidden>
    <div class="box" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
      <span class="kicker">סופ״ש סוכות · וילה בצפון</span>
      <h2 id="gateTitle">מאיזו משפחה אתם?</h2>
      <p>כדי שנדע מי מביא מה ומי אחראי על איזו ארוחה. אפשר לשנות בכל רגע מהכותרת למעלה.</p>
      <div class="opts" id="gateOpts"></div>
    </div>
  </div>
  <main><div class="wrap" id="view">
    <div class="card"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </div></main>
</div>

<script>
document.documentElement.setAttribute("lang","he");
document.documentElement.setAttribute("dir","rtl");

const FAMS=[

/* ---------- writes ---------- */
let toastT=null;
function toast(msg,actLabel,fn){
  let el=document.getElementById("toast");
  if(!el){ el=document.createElement("div"); el.id="toast"; document.getElementById("app").appendChild(el); }
  el.innerHTML='<span class="t"></span>'+(actLabel?'<button type="button">'+esc(actLabel)+"</button>":"");
  el.querySelector(".t").textContent=msg;
  const b=el.querySelector("button");
  if(b) b.onclick=()=>{ el.classList.remove("show"); if(fn) fn(); };
  el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),7000);
}

/* ---------- storage: firebase when configured, otherwise this device only ---------- */
let fdb=null, presSelf=null, seeded=false;
const LKEY="sukkot-local-v1";
const clone=o=>JSON.parse(JSON.stringify(o||{}));

function localLoad(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(LKEY)||"null"); }catch(e){}
  if(!d||!d.items||!Object.keys(d.items).length){
    d={items:clone(window.SEED),meals:clone(window.SEED_MEALS),trip:clone(window.SEED_TRIP)};
  }
  return d;
}
function localSave(d){ try{ localStorage.setItem(LKEY,JSON.stringify(d)); }catch(e){} }
function localApply(d){
  const m=new Map();
  Object.keys(d.items||{}).forEach(k=>m.set(k,Object.assign({id:k},d.items[k])));
  items=m; mealDocs=d.meals||{}; trip=d.trip||{};
}
function localMut(fn){ const d=localLoad(); fn(d); localSave(d); localApply(d); render(); }

function wr(fn){
  try{ const p=fn(); if(p&&p.catch) p.catch(e=>{ console.warn(e); toast("השמירה לא עברה — בדקו את החיבור לאינטרנט."); }); }
  catch(e){ console.warn(e); }
}
const setItem=(id,d)=> fdb ? wr(()=>fdb.ref("items/"+id).set(d)) : localMut(x=>{ x.items[id]=d; });
const upItem =(id,d)=> fdb ? wr(()=>fdb.ref("items/"+id).update(d)) : localMut(x=>{ if(x.items[id]) Object.assign(x.items[id],d); });
const delItem=(id)  => fdb ? wr(()=>fdb.ref("items/"+id).remove()) : localMut(x=>{ delete x.items[id]; });
const setMeal=(k,d) => fdb ? wr(()=>fdb.ref("meals/"+k).update(d)) : localMut(x=>{ x.meals[k]=Object.assign({},x.meals[k],d); });
const setTrip=(d)   => fdb ? wr(()=>fdb.ref("meta/trip").update(d)) : localMut(x=>{ x.trip=Object.assign({},x.trip,d); });

function addItem(o){
  const id=newId();
  const max=arr().reduce((m,i)=>Math.max(m,i.o||0),0);
  const rec=Object.assign({t:"",q:"",c:"dry",m:"",b:"",d:false,s:"buy",f:"",o:max+1},o);
  items.set(id,Object.assign({id},rec));
  render();
  setItem(id,rec);
}

/* ---------- header ---------- */
function paintHeader(){
  const sh=shopAll(), done=sh.filter(i=>i.d).length, tot=sh.length;
  const pct=tot?Math.round(done/tot*100):0;
  const C=2*Math.PI*18;
  const arc=document.getElementById("ringArc");
  arc.style.strokeDashoffset=String(C*(1-pct/100));
  arc.setAttribute("stroke", pct===100?"var(--good)":"var(--accent)");
  document.getElementById("ringPct").textContent=tot?pct+"%":"—";
  document.getElementById("gaugeMain").textContent=tot?done+" / "+tot:"— / —";
  document.getElementById("cShop").textContent=tot?String(tot-done):"–";
  const g=arr().filter(i=>GEARCATS.includes(i.c)&&!i.d).length;
  document.getElementById("cGear").textContent=items.size?String(g):"–";
  document.getElementById("hdrDates").textContent=trip.dates||"חמישי 24.9 — שבת 26.9";
}

function paintPresence(list){
  const el=document.getElementById("live"), txt=document.getElementById("liveTxt"), st=document.getElementById("liveStack");
  if(!list){
    el.classList.remove("on");
    txt.textContent = fdb ? "מתחבר…" : "נשמר במכשיר הזה";
    st.innerHTML=""; return;
  }
  el.classList.add("on");
  const n=list.length;
  txt.textContent = n<=1 ? "רק אתם כאן" : n+" מחוברים עכשיו";
  const chips=list.map(p=>FAMBY[p.fam]).filter(Boolean).slice(0,6);
  st.innerHTML=chips.map(f=>'<i style="background:var(--f-'+f.k+')" title="'+esc(f.n)+'">'+esc(f.s[0])+"</i>").join("");
}

  const f=FAMBY[k]; if(!f) return "";

}
function buyerSel(it){
  const shop=it.b==="shop";
  const st=!it.b?"":(shop
    ? 'style="color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--accent-soft)"'

function rowHTML(it,o){

  return '<li class="row'+(it.d?" done":"")+'" data-id="'+it.id+'">'+
    '<button class="tick" data-act="toggle" data-id="'+it.id+'" aria-pressed="'+(it.d?"true":"false")+'" aria-label="סימון '+esc(it.t)+'">✓</button>'+

    "</span>"+
    '<button class="kill" data-act="del" data-id="'+it.id+'" aria-label="מחיקת '+esc(it.t)+'">×</button>'+
  "</li>";
}
function barHTML(done,tot){
  const p=tot?Math.round(done/tot*100):0;
  return '<span class="mini"><span class="bar'+(p===100?" full":"")+'"><i style="width:'+p+'%"></i></span><span class="num">'+done+"/"+tot+"</span></span>";
}
function addForm(kind,key,ph){

    "<button>הוספה</button></form>";
}

}

<script>
/* ---------- views ---------- */
function skeleton(){
  return '<div class="card">'+Array(6).fill('<div class="skel"></div>').join("")+"</div>";
}
function offNotice(){
  return '<div class="notice"><b>אין כרגע חיבור לרשימה המשותפת</b> — מה שתסמנו נשמר רק במכשיר הזה. '+

}

function tripBar(){

    '<label for="tDates">תאריכים</label><input id="tDates" data-fid="trip-dates" data-trip="dates" value="'+esc(trip.dates||"חמישי 24.9 — שבת 26.9")+'">'+
    '<label for="tVilla">הוילה</label><input id="tVilla" data-fid="trip-villa" data-trip="villa" value="'+esc(trip.villa||"")+'" placeholder="שם, כתובת, שעת כניסה…">'+
    '<label for="tNote">הערה לכולם</label><input id="tNote" data-fid="trip-note" data-trip="note" value="'+esc(trip.note||"")+'" placeholder="למשל: נפגשים בכניסה ב-16:00">'+
  "</div>";
}

function renderMeals(){
  forceOpen=false;
  let h=tripBar()+'<div class="toolbar">'+openAllBtn()+'<span class="hint">לחיצה על כותרת ארוחה פותחת וסוגרת אותה. מה שתפתחו יישאר פתוח במכשיר הזה.</span></div>';
  DAYS.forEach(day=>{
    h+='<div class="daybar"><h2>'+esc(day.t)+'</h2><span class="rule"></span>'+(day.s?'<span class="stamp">'+esc(day.s)+"</span>":"")+"</div>";
    day.meals.forEach(mk=>{
      const m=MEALBY[mk], list=arr().filter(i=>i.m===mk&&i.c!=="personal");
      const done=list.filter(i=>i.d).length;
      const md=mealDocs[mk]||{};
      const id="meal-"+mk;

            FAMS.map(f=>'<option value="'+f.k+'"'+(md.chef===f.k?" selected":"")+">"+esc(f.n)+"</option>").join("")+"</select>"+
            '<input data-fid="mnote-'+mk+'" data-mnote="'+mk+'" placeholder="הערה לארוחה — מי מביא מה, מתי מתחילים…" value="'+esc(md.note||"")+'" style="flex:1 1 220px;border:0;border-bottom:1px dashed var(--line-2);background:transparent;padding:3px 2px;font-size:12.5px">'+

function renderShop(){
  const qq=q.trim();
  forceOpen=!!qq;
  let base=shopAll().filter(i=>i.c!=="task");
  if(shopFilter==="todo") base=base.filter(i=>!i.d);
  if(shopFilter==="done") base=base.filter(i=>i.d);
  if(who==="mine"&&me) base=base.filter(i=>i.b===me);
  if(who==="shop") base=base.filter(i=>i.b==="shop");
  if(qq) base=base.filter(i=>i.t.indexOf(qq)>-1);

  const total=shopAll().filter(i=>i.c!=="task");
  const unassigned=total.filter(i=>!i.b&&!i.d).length;
  const myLeft=me?total.filter(i=>i.b===me&&!i.d).length:0;
  const shopLeft=total.filter(i=>i.b==="shop"&&!i.d).length;
  const shopTot=total.filter(i=>i.b==="shop").length;

  let h='<div class="toolbar">'+
    '<input data-fid="search" id="sq" placeholder="חיפוש פריט…" value="'+esc(q)+'" style="border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;min-width:170px">'+
    '<button class="chip" data-act="filter" data-v="todo" aria-pressed="'+(shopFilter==="todo")+'">חסר לקנייה</button>'+
    '<button class="chip" data-act="filter" data-v="done" aria-pressed="'+(shopFilter==="done")+'">כבר נקנה</button>'+
    '<button class="chip" data-act="filter" data-v="all" aria-pressed="'+(shopFilter==="all")+'">הכל</button>'+
    '<button class="chip" data-act="who" data-v="shop" aria-pressed="'+(who==="shop")+'">רשימת הקנייה המשותפת</button>'+
    '<button class="chip" data-act="who" data-v="mine" aria-pressed="'+(who==="mine")+'"'+(me?"":" disabled title=\"בחרו קודם את המשפחה שלכם למעלה\"")+'>רק מה שאני מביא</button>'+
    openAllBtn()+
    '<button class="chip" data-act="allshop" style="margin-inline-start:auto">שייכו את כל מה שלא משויך לרשימת הקניות</button>'+
    "</div>";

  h+='<div class="notice">';
  h+="<b>הקנייה המשותפת בבוקר חמישי:</b> "+shopLeft+" פריטים נותרו מתוך "+shopTot+". ";
  if(me) h+="<b>"+esc(FAMBY[me].n)+"</b> מביאה בעצמה עוד <b>"+myLeft+"</b> פריטים. ";
  else h+="בחרו את המשפחה שלכם למעלה כדי לראות מה אתם מביאים. ";
  h+="עדיין ללא שיוך: <b>"+unassigned+"</b>. סמנו ✓ ברגע שנקנה — כולם רואים מיד, ולחיצה על שם פריט או על הכמות פותחת אותם לעריכה.</div>";

  CATS.forEach(([ck,cn])=>{
    if(ck==="task") return;
    const list=base.filter(i=>i.c===ck);
    if(!list.length) return;
    const inCat=total.filter(i=>i.c===ck);
    const id="shop-"+ck;
    h+='<section class="card" data-open="'+(isOpen(id)?1:0)+'">'+
      foldHead(id,"<span><h3>"+esc(cn)+'</h3></span><span class="meta">'+barHTML(inCat.filter(i=>i.d).length,inCat.length)+"</span>")+
      '<div class="c-body">'+
        '<div class="chefline"><span>שייכו את כל מה שלא משויך בקטגוריה ל־</span>'+
          '<select data-act="bulk" data-key="'+ck+'" aria-label="שיוך כל הקטגוריה"><option value="">בחרו…</option><option value="shop">רשימת קניות משותפת</option>'+
          FAMS.map(f=>'<option value="'+f.k+'">'+esc(f.n)+"</option>").join("")+"</select></div>"+
        '<ul class="rows">'+list.map(i=>rowHTML(i,{showMeal:true})).join("")+"</ul>"+
        addForm("cat",ck,"פריט נוסף לקטגוריה…")+
      "</div></section>";
  });
  if(!base.length) h+='<div class="empty card">אין פריטים שמתאימים לסינון הנוכחי.</div>';
  return h;
}

function renderGear(){
  forceOpen=false;
  let h='<div class="toolbar">'+openAllBtn()+'</div>'+
    '<div class="notice">כאן יושב כל מה שאינו אוכל. לכל פריט יש מתג <b>לקנות / מהבית</b> — מה שמסומן «מהבית» יורד אוטומטית מרשימת הקניות.</div>';
  GEARCATS.forEach(ck=>{
    const list=arr().filter(i=>i.c===ck);
    const id="gear-"+ck;
    const done=list.filter(i=>i.d).length;
    h+='<section class="card" data-open="'+(isOpen(id)?1:0)+'">'+
      foldHead(id,"<span><h3>"+esc(CATBY[ck])+"</h3>"+(ck==="task"?'<div class="sub">דברים לברר מול בעל הוילה או לסגור בינינו</div>':"")+
        '</span><span class="meta">'+barHTML(done,list.length)+"</span>")+
      '<div class="c-body">'+
        (list.length?'<ul class="rows">'+list.map(i=>rowHTML(i,{srcToggle:ck!=="task",noBuyer:ck==="task"})).join("")+"</ul>":'<div class="empty">ריק בינתיים.</div>')+
        addForm("cat",ck,ck==="task"?"מה עוד צריך לברר?":"פריט ציוד נוסף…")+
      "</div></section>";
  });
  return h;
}

function renderFams(){
  const sl=shopAll().filter(i=>i.b==="shop");
  let h='<section class="card" style="border-color:color-mix(in srgb,var(--accent) 45%,var(--line));margin-bottom:14px">'+
    '<div class="c-head" style="background:var(--accent-soft)"><span><span class="eyebrow" style="color:var(--accent-ink)">חמישי בבוקר · כולנו יחד</span>'+
    "<h3>הקנייה המשותפת</h3></span>"+'<span class="meta">'+barHTML(sl.filter(i=>i.d).length,sl.length)+"</span></div>"+
    '<div class="assigned"><b class="num">'+sl.filter(i=>!i.d).length+"</b><span>פריטים ברשימת הקנייה המשותפת נותרו לקנות</span>"+
    '<button class="chip" data-act="goshop" style="margin-inline-start:auto">פתחו את הרשימה</button></div></section>'+
    '<div class="notice">לכל משפחה יש רשימה משלה — מה להביא מהבית, מה לא לשכוח, בקשות מיוחדות. הרשימות גלויות לכולם כדי שלא נביא חמישה רמקולים.</div><div class="famgrid">';
  FAMS.forEach(f=>{
    const mine=f.k===me;
    const own=arr().filter(i=>i.c==="personal"&&i.f===f.k);
    const buy=shopAll().filter(i=>i.b===f.k);
    const buyLeft=buy.filter(i=>!i.d).length;
    const chefOf=MEALS.filter(m=>(mealDocs[m.k]||{}).chef===f.k);
    h+='<section class="card fam-card'+(mine?" mine":"")+'" style="--fc:var(--f-'+f.k+')">'+
      '<div class="c-head"><span><h3>'+esc(f.n)+"</h3>"+
        (chefOf.length?'<div class="sub">אחראים על: '+chefOf.map(m=>esc(m.n)).join(" · ")+"</div>":'<div class="sub">לא שובצו עדיין לארוחה</div>')+
      "</span>"+(mine?'<span class="meta"><span class="you">אני</span></span>':"")+"</div>"+
      '<div class="assigned"><b class="num">'+buyLeft+"</b><span>פריטים נותרו להביא מתוך "+buy.length+" ששויכו למשפחה</span></div>"+
      (own.length?'<ul class="rows">'+own.map(i=>rowHTML(i,{noBuyer:true})).join("")+"</ul>":'<div class="empty">אין עדיין רשימה אישית.</div>')+
      addForm("fam",f.k,"מה להביא מהבית?")+
    "</section>";
  });
  return h+"</div>";
}

/* ---------- render ---------- */
function render(){
  const ae=document.activeElement;
  const fid=ae&&ae.getAttribute?ae.getAttribute("data-fid"):null;
  let pos=null; if(fid){ try{pos=ae.selectionStart;}catch(e){} }
  const vals={};
  view.querySelectorAll("[data-fid]").forEach(el=>{vals[el.getAttribute("data-fid")]=el.value;});
  let html;
  if(dbState==="loading") html=skeleton();
  else html=(dbState==="local"?offNotice():"")+(tab==="meals"?renderMeals():tab==="shop"?renderShop():tab==="gear"?renderGear():renderFams());
  view.innerHTML=html;
  view.querySelectorAll("[data-fid]").forEach(el=>{
    const v=vals[el.getAttribute("data-fid")];
    if(v!=null&&el.value==="") el.value=v;
  });
  if(fid){ const el=view.querySelector('[data-fid="'+fid+'"]'); if(el){ el.focus(); if(pos!=null&&el.setSelectionRange){ try{el.setSelectionRange(pos,pos);}catch(e){} } } }
  paintHeader();
}

/* ---------- events ---------- */
function setTab(t){
  tab=t;
  document.querySelectorAll("#tabs button[data-tab]").forEach(x=>x.setAttribute("aria-selected",String(x.dataset.tab===t)));
}
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button[data-tab]"); if(!b) return;
  setTab(b.dataset.tab); render();
});

const fp=document.getElementById("fampick");
FAMS.forEach(f=>{ const o=document.createElement("option"); o.value=f.k; o.textContent=f.n; fp.appendChild(o); });
fp.value=me;
function setMe(v){
  me=v; fp.value=v;
  try{ localStorage.setItem("sk-fam",me); }catch(e){}
  if(presSelf) presSelf.update({fam:me||""});
  paintGate(); render();
}
fp.addEventListener("change",()=>setMe(fp.value));

const gate=document.getElementById("gate");
document.getElementById("gateOpts").innerHTML=FAMS.map(f=>
  '<button type="button" data-fam="'+f.k+'"><i style="background:var(--f-'+f.k+')"></i>'+esc(f.n)+"</button>"
).join("");
gate.addEventListener("click",e=>{
  const b=e.target.closest("[data-fam]"); if(!b) return;
  setMe(b.dataset.fam);
});
function paintGate(){ gate.hidden=!!me; }
paintGate();

view.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==="toggle"){ const it=items.get(id); if(!it) return; it.d=!it.d; render(); upItem(id,{d:it.d}); }
  else if(act==="del"){
    const it=items.get(id); if(!it) return;
    const rec=Object.assign({},it); delete rec.id;
    items.delete(id); render(); delItem(id);
    toast('"'+it.t+'" נמחק', "ביטול", ()=>{ items.set(id,Object.assign({id:id},rec)); render(); setItem(id,rec); });
  }
  else if(act==="src"){ const it=items.get(id); if(!it) return; it.s=it.s==="home"?"buy":"home"; render(); upItem(id,{s:it.s}); }
  else if(act==="fold"){ const k=b.dataset.sec; openSecs[k]=!openSecs[k]; saveOpen(); render(); }
  else if(act==="openall"){ const want=!anyOpen(); secIds().forEach(k=>{ if(want) openSecs[k]=true; else delete openSecs[k]; }); saveOpen(); render(); }
  else if(act==="filter"){ shopFilter=b.dataset.v; render(); }
  else if(act==="who"){ const v=b.dataset.v; who=(who===v?"":v); render(); }
  else if(act==="allshop"){
    const targets=shopAll().filter(i=>i.c!=="task"&&!i.b);
    if(!targets.length){ toast("כל הפריטים כבר משויכים."); return; }
    const ids=targets.map(i=>i.id);
    targets.forEach(i=>{ i.b="shop"; upItem(i.id,{b:"shop"}); });
    render();
    toast(ids.length+" פריטים שויכו לרשימת הקנייה המשותפת","ביטול",()=>{ ids.forEach(x=>{ const it=items.get(x); if(it){it.b="";upItem(x,{b:""});} }); render(); });
  }
  else if(act==="goshop"){ setTab("shop"); who="shop"; shopFilter="all"; render(); }
  else if(act==="reconnect"){ location.replace(location.pathname+"?r="+Date.now()); }
  else if(act==="edit"){
    const it=items.get(id); if(!it) return;
    editing=id; editT=it.t||""; editQ=it.q||""; render();
    const inp=view.querySelector('[data-fid="editt-'+id+'"]');
    if(inp){ inp.focus(); try{ inp.setSelectionRange(inp.value.length,inp.value.length); }catch(e){} }
  }
  else if(act==="canceledit"){ editing=null; render(); }
});

view.addEventListener("keydown",e=>{
  const t=e.target;
  if(t&&t.dataset&&t.dataset.act==="edit"&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); t.click(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&editing){ editing=null; render(); } });

view.addEventListener("change",e=>{
  const el=e.target, act=el.dataset.act;
  if(act==="buyer"){ const it=items.get(el.dataset.id); if(!it) return; it.b=el.value; render(); upItem(it.id,{b:it.b}); }
  else if(act==="chef"){ const k=el.dataset.key; mealDocs[k]=Object.assign({},mealDocs[k],{chef:el.value}); render(); setMeal(k,{chef:el.value}); }
  else if(act==="bulk"){
    const ck=el.dataset.key, fam=el.value; if(!fam) return;
    const targets=shopAll().filter(i=>i.c===ck&&!i.b);
    el.value="";
    if(!targets.length){ toast("אין בקטגוריה הזו פריטים ללא שיוך."); return; }
    const ids=targets.map(i=>i.id);
    targets.forEach(i=>{ i.b=fam; upItem(i.id,{b:fam}); });
    render();
    toast(ids.length+" פריטים שויכו ל"+(fam==="shop"?"רשימת הקנייה המשותפת":FAMBY[fam].n),"ביטול",
      ()=>{ ids.forEach(x=>{ const it=items.get(x); if(it){it.b="";upItem(x,{b:""});} }); render(); });
  }
});

const timers={};
function debounce(key,fn,ms){ clearTimeout(timers[key]); timers[key]=setTimeout(fn,ms); }
view.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.editfield){ if(el.dataset.editfield==="t") editT=el.value; else editQ=el.value; return; }
  if(el.id==="sq"){ q=el.value; debounce("search",render,180); return; }
  if(el.dataset.trip!=null&&el.dataset.trip!==""){
    const f=el.dataset.trip, v=el.value;
    trip=Object.assign({},trip,{[f]:v});
    debounce("trip-"+f,()=>{ setTrip({[f]:v}); paintHeader(); },500);
    return;
  }
  if(el.dataset.mfield){
    const k=el.dataset.key, f=el.dataset.mfield, v=el.value;
    mealDocs[k]=Object.assign({},mealDocs[k],{[f]:v});
    debounce("meal-"+k+"-"+f,()=>setMeal(k,{[f]:v}),500);
    return;
  }
  if(el.dataset.mnote){
    const k=el.dataset.mnote, v=el.value;
    mealDocs[k]=Object.assign({},mealDocs[k],{note:v});
    debounce("mnote-"+k,()=>setMeal(k,{note:v}),500);
  }
});

view.addEventListener("submit",e=>{
  const ef=e.target.closest("form.editform");
  if(ef){
    e.preventDefault();
    const id=ef.dataset.edit, it=items.get(id);
    const t=editT.trim(), qv=editQ.trim();
    editing=null;
    if(it&&t&&(t!==it.t||qv!==(it.q||""))){ it.t=t; it.q=qv; upItem(id,{t:t,q:qv}); }
    render();
    return;
  }
  const f=e.target.closest("form.add"); if(!f) return;
  e.preventDefault();
  const t=f.querySelector("input.t").value.trim(); if(!t) return;
  const qv=f.querySelector("input.q").value.trim();
  const kind=f.dataset.add, key=f.dataset.key;
  if(kind==="meal") addItem({t:t,q:qv,m:key,c:"dry",b:"shop"});
  else if(kind==="cat") addItem({t:t,q:qv,c:key,b:(key==="task"||key==="gear")?"":"shop",s:key==="task"?"home":"buy"});
  else if(kind==="fam") addItem({t:t,q:qv,c:"personal",f:key,s:"home"});
  f.reset();
  const inp=f.querySelector("input.t"); if(inp) inp.focus();
});

/* ---------- boot ---------- */
function seedObject(){ return clone(window.SEED); }
function seedRemote(){
  if(seeded) return; seeded=true;
  fdb.ref("meta/seeded").transaction(cur=>(cur?undefined:Date.now()),(err,committed)=>{
    if(err||!committed) return;
    fdb.ref("items").set(seedObject());
    fdb.ref("meals").update(clone(window.SEED_MEALS));
    fdb.ref("meta/trip").update(clone(window.SEED_TRIP));
  });
}
function goLocal(){ dbState="local"; fdb=null; localApply(localLoad()); render(); paintPresence(null); }

function initPresence(){
  const pr=fdb.ref("presence");
  presSelf=pr.push();
  fdb.ref(".info/connected").on("value",s=>{
    if(!s.val()) return;
    presSelf.onDisconnect().remove();
    presSelf.set({fam:me||"",t:Date.now()});
  });
  pr.on("value",s=>{
    const v=s.val()||{};
    paintPresence(Object.keys(v).map(k=>({fam:v[k]&&v[k].fam})));
  });
}

function boot(tries){
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.databaseURL||cfg.databaseURL.indexOf("PASTE_")>=0){ goLocal(); return; }
  if(typeof firebase==="undefined"){
    if(tries<20){ setTimeout(()=>boot(tries+1),500); return; }
    goLocal(); return;
  }
  try{
    firebase.initializeApp(cfg);
    fdb=firebase.database();
    fdb.ref("items").on("value",s=>{
      const v=s.val();
      if(v===null){ items=new Map(); seedRemote(); }
      else{
        const m=new Map();
        Object.keys(v).forEach(k=>m.set(k,Object.assign({id:k},v[k])));
        items=m;
      }
      dbState="on"; render();
    },e=>{ console.warn(e); goLocal(); });
    fdb.ref("meals").on("value",s=>{ mealDocs=s.val()||{}; render(); },()=>{});
    fdb.ref("meta/trip").on("value",s=>{ trip=s.val()||{}; render(); },()=>{});
    initPresence();
    paintPresence(null);
  }catch(e){ console.warn(e); goLocal(); }
}
boot(0);
setTimeout(()=>{ if(dbState==="loading" && !fdb) goLocal(); },15000);
render();
</script>
